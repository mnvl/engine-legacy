
package chloe.proto.service;

// handshake is first message sent from client to server
message handshake
{
	required uint32 protocol_version = 1;
};

message handshake_reply
{
	required bool is_supported = 1;
};

// time sync used to synchronize client and server timers
// (may be sent from client to server)
message time_sync
{
};

message time_sync_reply
{
    required uint32 server_time = 1;
};

// this messages can be sent from server to client and inverse
message logic_error
{
	required string message = 1;
};

message internal_error
{
	required string message = 1;
};
